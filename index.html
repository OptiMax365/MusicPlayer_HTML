<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 POSSIBILITYDATA — Always-On Music Sync</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0f0a; --bg-secondary: #0f1a0f; --bg-card: #1a2e1a;
            --bg-input: #142a14; --accent: #1a5f1a; --accent-light: #2d862d;
            --highlight: #00c853; --text-primary: #ffffff; --text-secondary: #a8d8a8;
            --success: #00e676; --warning: #ffb74d; --border: #2a4a2a;
            --glow: rgba(0, 200, 83, 0.35); --radius: 16px;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(0, 200, 83, 0.06) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(0, 230, 118, 0.04) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite; z-index: -1; pointer-events: none;
        }
        @keyframes bgFloat { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-2%, -2%) rotate(1deg); } }
        
        .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
        header { text-align: center; padding: 20px 0; }
        .logo { font-size: 2.5rem; margin-bottom: 5px; animation: pulse 2s infinite; display: inline-block; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        header h1 { 
            font-size: 1.8rem; font-weight: 800; 
            background: linear-gradient(135deg, var(--highlight), var(--accent-light), #66bb6a); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; 
        }
        header p { color: var(--text-secondary); margin-top: 6px; font-size: 0.9rem; }

        .status-bar {
            display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px;
            margin-bottom: 16px; font-size: 13px; font-weight: 600; border: 1px solid var(--border);
        }
        .status-bar.disconnected { background: rgba(255, 107, 107, 0.1); border-color: rgba(255, 107, 107, 0.3); color: #ff8a8a; }
        .status-bar.connecting { background: rgba(0, 200, 83, 0.1); border-color: rgba(0, 200, 83, 0.3); color: var(--highlight); }
        .status-bar.connected { background: rgba(0, 230, 118, 0.1); border-color: rgba(0, 230, 118, 0.3); color: var(--success); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
        .status-bar.connecting .status-dot { animation: pulse 1s infinite; }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
        .main-grid { display: grid; grid-template-columns: 280px 1fr 300px; gap: 16px; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; color: var(--highlight); }

        .btn {
            padding: 12px 16px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, var(--highlight), var(--accent-light)); color: white; }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 4px 20px var(--glow); }
        .btn-success { background: linear-gradient(135deg, var(--success), #00b368); color: #000; }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #e05555); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--highlight); color: var(--highlight); }
        .btn-outline:hover:not(:disabled) { background: rgba(0, 200, 83, 0.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-sm { padding: 8px 12px; font-size: 12px; width: auto; }

        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
        .input-field {
            width: 100%; padding: 12px; background: var(--bg-input); border: 2px solid var(--border);
            border-radius: 10px; color: var(--text-primary); font-size: 14px;
        }
        .input-field:focus { outline: none; border-color: var(--highlight); }
        .input-field.identifier { text-align: center; font-family: monospace; font-size: 16px; letter-spacing: 2px; }

        .drop-zone {
            border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px 16px; text-align: center;
            cursor: pointer; transition: all 0.3s; position: relative; background: var(--bg-input);
        }
        .drop-zone:hover, .drop-zone.dragover, .drop-zone:focus {
            border-color: var(--highlight); background: rgba(0, 200, 83, 0.05); outline: none; box-shadow: 0 0 15px var(--glow);
        }
        .drop-zone .drop-icon { font-size: 36px; margin-bottom: 8px; }
        .drop-zone .drop-text { font-size: 14px; color: var(--text-primary); margin-bottom: 4px; }
        .drop-zone .drop-subtext { font-size: 11px; color: var(--text-secondary); }
        .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .highlight { color: var(--highlight); font-weight: 700; }

        .player-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
        .player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: 700; color: var(--highlight); font-size: 14px; }
        .track-info {
            background: var(--bg-input); padding: 10px; border-radius: 8px; margin-bottom: 12px;
            font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-secondary);
        }
        .track-info.active { color: var(--highlight); font-weight: 700; border: 1px solid var(--highlight); box-shadow: 0 0 10px var(--glow); }
        
        .player-controls { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
        .player-controls button {
            background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary);
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .player-controls button:hover { background: var(--highlight); color: white; border-color: var(--highlight); }
        .player-controls button.play-btn { width: 48px; height: 48px; font-size: 22px; background: var(--highlight); color: white; border: none; }

        .seek-control { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 11px; color: var(--text-secondary); font-family: monospace; }
        .seek-control input[type="range"] { flex: 1; accent-color: var(--highlight); cursor: pointer; height: 6px; }
        
        .pan-control { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary); }
        .pan-control input[type="range"] { flex: 1; accent-color: var(--highlight); }
        .pan-buttons { display: flex; gap: 4px; margin-top: 6px; width: 100%; }
        .pan-buttons button {
            flex: 1; padding: 6px; font-size: 11px; background: var(--bg-input);
            border: 1px solid var(--border); color: var(--text-secondary); border-radius: 6px; cursor: pointer;
        }
        .pan-buttons button:hover, .pan-buttons button.active { border-color: var(--highlight); color: var(--highlight); background: rgba(0,200,83,0.1); }
        
        .device-control { margin-bottom: 12px; font-size: 12px; }
        .device-control select {
            width: 100%; padding: 8px; margin-top: 4px; background: var(--bg-input);
            border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; font-size: 12px;
        }
